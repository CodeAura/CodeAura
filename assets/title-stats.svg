<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="GitHub stats">
<defs>
  
<linearGradient id="logoGrad" x1="0" y1="1" x2="1" y2="0">
  <stop offset="0" stop-color="#C8109A"/>
  <stop offset="0.45" stop-color="#F7678A"/>
  <stop offset="1" stop-color="#FBBF9A"/>
</linearGradient>

  <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F7678A"/><stop offset="1" stop-color="#FA7F50"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F7678A" stop-opacity="0.9"/><stop offset="1" stop-color="#FA7F50" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .grow { animation: grow 1.2s cubic-bezier(.2,.8,.2,1) both .2s; transform-origin: left center; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
<g transform="translate(4 14) scale(0.03879)" fill="url(#logoGrad)">
<polygon points="183,2 396,2 381,79 276,79 125,842 229,842 213,920 0,920"/>
<polygon points="680,0 777,0 378,928 284,928"/>
<polygon points="859,2 1073,2 889,920 676,920 692,842 795,842 948,79 844,79"/>
</g>
<text x="62" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="3" fill="url(#t)">GITHUB STATS</text>
<rect class="grow" x="344" y="31" width="656" height="3" rx="1.5" fill="url(#line)"/>
</svg>
